<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ummah — Administrative</title>
<link rel="stylesheet" href="assets/css/app.css?v=71">
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#5b2e91">
</head>
<body>

<div id="icon-sprite"></div>

<div class="app">

  <div id="login-view" class="login-wrap" hidden>
    <div class="login-card">
      <a href="index.html" class="back-link"><span class="back-icon">BACK_ICON</span>Back to site</a>
      <img class="login-logo" src="assets/icons/logo.svg" alt="" width="52" height="52">
      <h1 class="login-title">Administrative login</h1>
      <p class="login-sub">For MSA administrators only. There is no public sign-up.</p>
      <div id="login-error" class="error-banner" hidden></div>
      <form id="login-form">
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" class="input input-lg" type="text" name="username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="pw-wrap">
            <input id="login-password" class="input input-lg" type="password" name="password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" id="login-submit" class="btn btn-primary btn-lg">Log in</button>
      </form>
    </div>
  </div>

  <div id="app-view" hidden>

    <div id="list-view">
      <div class="exec-topbar">
        <div class="app-title">All events</div>
        <button type="button" id="logout-btn" class="logout-link">Log out</button>
      </div>

      <div class="new-post-box">
        <button type="button" id="new-post-toggle" class="new-post-toggle">
          <span class="plus-icon">PLUS_ICON</span>
          <span class="label">New post</span>
          <span id="new-post-chev" class="chev collapsed">CHEV_ICON</span>
        </button>

        <form id="post-form" class="post-form">
          <div class="type-grid" id="type-grid">
            <button type="button" class="type-option selected" data-type="prayer">Prayer</button>
            <button type="button" class="type-option" data-type="social">Social</button>
            <button type="button" class="type-option" data-type="announcement">Announcement</button>
            <button type="button" class="type-option" data-type="exec_meeting">Exec meeting</button>
          </div>

          <div id="form-error" class="error-banner" hidden></div>

          <div class="form-grid">
            <div class="field"><label>Title</label><input class="input" name="title" required></div>
            <div class="field"><label id="location-label">Room number</label><input class="input" name="location"></div>
            <div class="field"><label>Time</label><input class="input" type="datetime-local" name="event_time"></div>
            <div class="field"><label>Notes</label><textarea class="input" name="notes"></textarea></div>
            <div class="field"><label>Image link <span class="form-hint">(optional banner or flyer)</span></label><input class="input" type="url" name="image_url" placeholder="https://..." autocomplete="off"></div>
            <div class="field">
              <label>Priority</label>
              <select class="input" name="priority">
                <option value="normal">Normal</option>
                <option value="important">Important</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
            <label class="toggle-row">
              <input type="checkbox" name="pinned">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              Pin to the top
            </label>
            <label class="toggle-row">
              <input type="checkbox" name="accepts_feedback">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              Accept feedback
            </label>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Post update</button>
              <button type="button" id="discard-btn" class="btn btn-secondary">Discard</button>
            </div>
          </div>
        </form>
      </div>

      <div id="list-skeleton">
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
      </div>
      <div id="events-list"></div>
    </div>

    <div id="detail-view" hidden>
      <button type="button" id="detail-back" class="back-link">
        <span class="back-icon">BACK_ICON</span>All events
      </button>

      <div id="detail-skeleton">
        <div class="skeleton skeleton-hero"></div>
      </div>

      <div id="detail-content" hidden>
        <div id="detail-card"></div>

        <div class="section-heading" style="margin-top:20px">
          <div class="label">Feedback</div>
          <span class="count" id="detail-feedback-count"></span>
        </div>
        <div id="detail-feedback-list"></div>

        <div id="detail-actionbar" class="detail-actionbar"></div>
        <div id="detail-hint" class="form-hint" style="margin-top:9px"></div>
      </div>
    </div>

  </div>

  <footer class="app-footer">
    <nav class="footer-links" aria-label="Footer">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Use</a>
      <a href="index.html">Home</a>
    </nav>
    <p class="footer-copy">&copy; 2026 Ummah</p>
  </footer>
</div>

<script type="module">
  import { ICON_SPRITE, icon } from "./assets/js/icons.js?v=10";
  document.getElementById("icon-sprite").innerHTML = ICON_SPRITE;
  document.querySelector(".plus-icon").innerHTML = icon("i-plus", { size: 16, stroke: 2.75 });
  document.getElementById("new-post-chev").innerHTML = icon("i-chev", { size: 15, stroke: 2.75 });
  document.querySelector("[data-pw-toggle]")?.addEventListener("click", (ev) => {
    const input = document.getElementById("login-password");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    ev.currentTarget.textContent = show ? "Hide" : "Show";
    ev.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });
  document.querySelectorAll(".back-icon").forEach((el) => { el.innerHTML = icon("i-back", { size: 14, stroke: 2.75 }); });
</script>
<script type="module" src="assets/js/exec.js?v=29"></script>
<script src="assets/js/fx.js?v=1" defer></script>
<script src="assets/js/sw-register.js?v=1"></script>
</body>
</html>
