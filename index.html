<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ummah</title>
<meta name="description" content="Updates, room numbers and events.">
<link rel="stylesheet" href="assets/css/app.css?v=71">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#5b2e91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ummah">
</head>
<body>

<div id="icon-sprite"></div>

<div class="app">
  <header class="app-header masthead">
    <div class="app-title" aria-label="NCHS MSA, Ummah"><span class="app-name">Ummah</span><span class="app-org"><span>NCHS</span><span>MSA</span></span></div>
    <div class="stats" id="stats" aria-label="Community at a glance">
      <div class="stat"><span class="stat-num" id="stat-announcements">&ndash;</span><span class="stat-label">Announcements</span></div>
      <div class="stat"><span class="stat-num" id="stat-events">&ndash;</span><span class="stat-label">Upcoming events</span></div>
      <div class="stat"><span class="stat-num" id="stat-week">&ndash;</span><span class="stat-label">New this week</span></div>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="index.html" class="tab" aria-current="page">Updates</a>
    <a href="calendar.html" class="tab">Calendar</a>
  </nav>

  <div id="install-banner" class="install-banner" hidden></div>
  <div id="notify-banner" class="install-banner" hidden></div>

  <div id="skeleton">
    <div class="skeleton skeleton-hero"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
  </div>

  <div id="page" hidden>
    <div id="new-update-pill" class="new-update-pill" hidden>
      <button type="button" id="new-update-pill-btn" class="btn">New update — scroll up</button>
    </div>
    <div id="hero"></div>

    <section id="today-section" class="feed-section" hidden>
      <div class="section-heading">
        <div class="label">More today</div>
        <span class="count" id="today-count">0</span>
      </div>
      <div id="today-posts"></div>
    </section>

    <section id="history-section" class="feed-section" hidden>
      <div class="section-heading"><div class="label">Earlier</div></div>
      <div id="history"></div>
      <div id="load-more-wrap" hidden>
        <button type="button" id="load-more" class="btn load-more">Load more</button>
      </div>
    </section>
  </div>

  <footer class="app-footer">
    <nav class="footer-links" aria-label="Footer">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Use</a>
      <a href="exec.html">Administrative login</a>
    </nav>
    <p class="footer-note">No ads and no analytics. Feedback is anonymous.</p>
    <p class="footer-copy">&copy; 2026 Ummah</p>
  </footer>
</div>

<script type="module">
  import { ICON_SPRITE } from "./assets/js/icons.js?v=10";
  document.getElementById("icon-sprite").innerHTML = ICON_SPRITE;
</script>
<script type="module" src="assets/js/reader.js?v=26"></script>
<script type="module" src="assets/js/install.js?v=8"></script>
<script src="assets/js/fx.js?v=1" defer></script>
<script src="assets/js/sw-register.js?v=1"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script type="module" src="assets/js/notify.js?v=4"></script>
</body>
</html>
