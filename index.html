<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSA Updates</title>
<meta name="description" content="Prayer times, locations, and event updates for the MSA.">
<link rel="stylesheet" href="assets/css/app.css?v=4">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#c67139">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MSA Updates">
</head>
<body>

<div id="icon-sprite"></div>

<div class="app">
  <header class="app-header">
    <div class="app-title">MSA Updates</div>
    <a href="exec.html" class="exec-link">Exec login</a>
  </header>

  <div id="install-banner" class="install-banner" hidden></div>
  <div id="notify-banner" class="install-banner" hidden></div>

  <div id="skeleton">
    <div class="skeleton skeleton-hero"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
  </div>

  <div id="page" hidden>
    <div id="new-update-pill" class="new-update-pill" hidden>
      <button type="button" id="new-update-pill-btn" class="btn">New update — scroll up</button>
    </div>
    <div id="hero"></div>

    <div class="section-heading">
      <div class="label">Today's other posts</div>
      <span class="count" id="today-count">0</span>
    </div>
    <div id="today-posts"></div>

    <div class="divider"></div>

    <div class="section-heading"><div class="label">History</div></div>
    <div id="history"></div>

    <div id="load-more-wrap" hidden>
      <button type="button" id="load-more" class="btn load-more">Load more</button>
    </div>
  </div>
</div>

<script type="module">
  import { ICON_SPRITE } from "./assets/js/icons.js?v=4";
  document.getElementById("icon-sprite").innerHTML = ICON_SPRITE;
</script>
<script type="module" src="assets/js/reader.js?v=2"></script>
<script type="module" src="assets/js/install.js?v=1"></script>
<script src="assets/js/sw-register.js?v=1"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script type="module" src="assets/js/notify.js?v=1"></script>
</body>
</html>
