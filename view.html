<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>View — Ummah</title>
<meta name="description" content="Updates, room numbers and events.">
<link rel="stylesheet" href="assets/css/app.css?v=95">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#5b2e91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ummah">
</head>
<body>

<div id="icon-sprite"></div>

<div class="app">
  <header class="app-header masthead">
    <div class="app-title" aria-label="Ummah"><span class="app-name">Ummah</span></div>
  </header>


  <div id="skeleton">
    <div class="skeleton skeleton-hero"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
  </div>

  <div id="page" hidden>
    <div id="new-update-pill" class="new-update-pill" hidden>
      <button type="button" id="new-update-pill-btn" class="btn">New update — scroll up</button>
    </div>
    <div id="hero"></div>

    <section id="today-section" class="feed-section" hidden>
      <div class="section-heading">
        <div class="label">More today</div>
        <span class="count" id="today-count">0</span>
      </div>
      <div id="today-posts"></div>
    </section>

    <section id="upcoming-section" class="feed-section" hidden>
      <div class="section-heading">
        <div class="label">Coming up</div>
        <span class="count" id="upcoming-count">0</span>
      </div>
      <div id="upcoming-posts"></div>
    </section>

    <section id="history-section" class="feed-section" hidden>
      <div class="section-heading"><div class="label">Earlier</div></div>
      <div id="history"></div>
      <div id="load-more-wrap" hidden>
        <button type="button" id="load-more" class="btn load-more">Load more</button>
      </div>
    </section>
  </div>

  <nav class="bnav" aria-label="Administrative sections">
    <a href="exec.html" class="bnav-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-case"></use></svg><span>Admins</span></a>
    <a href="view.html" class="bnav-item" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-mega"></use></svg><span>View</span></a>
  </nav>
</div>

<script type="module">
  import { ICON_SPRITE } from "./assets/js/icons.js?v=11";
  document.getElementById("icon-sprite").innerHTML = ICON_SPRITE;
</script>
<script type="module">
  // Exec-side preview of the public Updates page: signed-in execs only.
  import { supabase } from "./assets/js/supabase-client.js";
  const { data } = await supabase.auth.getSession();
  if (!data.session) location.replace("exec.html");
</script>
<script type="module" src="assets/js/reader.js?v=30"></script>
<script src="assets/js/fx.js?v=4" defer></script>
<script src="assets/js/sw-register.js?v=1"></script>
</body>
</html>
